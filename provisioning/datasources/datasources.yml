apiVersion: 1

datasources:
  - name: 'demo-thruk-org'
    uid: 'demo-thruk-org'
    type: 'consolmonitoring-thruk-datasource'
    url: 'https://demo.thruk.org/demo/thruk'
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    basicAuth: true
    basicAuthUser: test
    jsonData:
      authType: basic
      path: '/resources'
      logPath: './logs/demo-thruk-org.log'
      logLevel: 7
    secureJsonData:
      apiKey: 'api-key'
      basicAuthPassword: test

